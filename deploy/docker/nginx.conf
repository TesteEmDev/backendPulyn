# Site e entrada HTTPS. Equivale ao web.config do IIS:
#   - /api/internal  -> bloqueado
#   - /api/...       -> backend
#   - WebSocket      -> backend (qualquer caminho com Upgrade: websocket)
#   - demais rotas   -> arquivos do site, ou index.html (o React cuida da navegação)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/internal/ {
        return 403;
    }

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Conexões WebSocket vão ao backend, em qualquer caminho.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        if ($http_upgrade = "websocket") {
            proxy_pass http://backend:3001;
        }
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
}
